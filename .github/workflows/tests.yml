name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"  # matches runtime.txt
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The apply-engine tests drive Chromium against local form pages (tests/fixtures/apply).
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      # No secrets needed: tests/conftest.py points the app at a throwaway
      # SQLite DB (built by the Alembic migrations) and fakeredis.
      - name: Run tests
        run: python -m pytest
