name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"  # matches runtime.txt
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The apply-engine tests drive Chromium against local form pages (tests/fixtures/apply).
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      # No secrets needed: tests/conftest.py points the app at a throwaway
      # SQLite DB (built by the Alembic migrations) and fakeredis.
      - name: Run tests
        run: python -m pytest

  # P6 acceptance: an ATS title search returns grouped companies in < 3 s on a
  # 300k-job index. Needs real Postgres (full-text search + GIN), so it runs here
  # against a service container; the main job's SQLite run skips that test.
  ats-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobfinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/jobfinder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migrate Postgres
        run: DATABASE_URL="$PG_URL" python -m alembic upgrade head

      - name: ATS search speed on 300k jobs
        run: ATS_PG_URL="$PG_URL" python -m pytest tests/test_ats_discovery.py -k postgres -v
